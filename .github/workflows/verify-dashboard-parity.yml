name: Verify dashboard and SQL migration
on:
  pull_request:
    paths:
      - 'scripts/build/**'
      - 'lib/db/client.ts'
      - 'next.config.ts'
      - 'package.json'
      - 'app/directories/lse/**'
      - 'app/api/directories/lse/**'
      - 'lib/domain/lse-directory*'
      - 'lib/scoring/**'
      - 'lib/discovery/startbook.ts'
      - 'scripts/ingest/import-lse-startbook*'
      - 'data/imports/lse-startbook*'
      - 'lib/domain/funding-stage*'
      - 'lib/domain/scout-workspace*'
      - 'lib/domain/sample-facets.ts'
      - 'lib/domain/facet-url.ts'
      - 'lib/domain/directory.ts'
      - 'lib/domain/source-quality.ts'
      - 'components/sample-instrument.tsx'
      - 'scripts/verify-stage-filters.mjs'
      - 'app/sources/page.tsx'
      - 'data/discovery/directories.json'
      - 'components/campus-workspace*'
      - 'components/company-location*'
      - 'components/tile-globe.tsx'
      - 'components/site-nav.tsx'
      - 'components/scout-icon.tsx'
      - 'lib/user-pipeline/**'
      - 'app/api/user-pipeline/route.ts'
      - 'scripts/postgres/**'
      - '.github/workflows/verify-dashboard-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:postgres-migration
      - run: npm run test:pipeline-owner
      - run: node --import tsx lib/domain/funding-stage.test.ts
      - run: node --import tsx lib/domain/scout-workspace.test.ts
      - run: node --import tsx lib/scoring/benchmark.test.ts
      - run: npx tsc --noEmit
      - run: npx eslint components/campus-workspace.tsx components/company-location-layer.tsx components/scout-icon.tsx components/site-nav.tsx components/tile-globe.tsx lib/user-pipeline/owner.ts lib/user-pipeline/store.ts app/api/user-pipeline/route.ts scripts/postgres/*.ts

      # Match Vercel's build environment; the source seed remains untouched.
      - run: npm run build
        env:
          VERCEL: '1'
      - run: npm run test:runtime-corpus
      - run: npx playwright install --with-deps chromium
      - run: node scripts/verify-stage-filters.mjs
        env:
          VERCEL: '1'
          CAMPUS_UNIVERSE_DB_PATH: /tmp/campus-browser-cold-start.db
