# Daily public-news refresh. Free GitHub Actions minutes only: no paid APIs.
# Shared feeds always run (press, campus papers, launches, Reddit, X search).
# Entity queries rotate through Penn, Berkeley, S/A,
# and funded startups first, capped so a day stays well under the free quota.
# A full sweep is still `npm run news:fetch` (resumable; see the script header).

name: Refresh news

on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run news:fetch -- --priority-only --max-targets 400 --fresh-hours 24
      - name: Commit news updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/campus-universe.db
          if git diff --cached --quiet; then
            echo "No news changes"
          else
            git commit -m "Refresh startup and founder news"
            git push
          fi
