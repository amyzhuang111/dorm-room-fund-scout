# Weekly bounded source collection (Devpost galleries from data/collectors/registry.json).
#
# Only registry entries with status "approved" run. Candidates proposed by
# discovery (data/collectors/candidates.json) never run until a human copies
# them into the registry. Every run is audited: any new affiliation above
# 'unverified' fails the job, so no PR is opened.
#
# Unlike news-fetch this does NOT push to main. campus-universe.db is a binary
# file that deploys on merge, so the run opens a pull request for review.
# Review tip: merge promptly; if main's database changed in the meantime
# (news-fetch commits daily), re-run this workflow instead of resolving the
# binary conflict by hand.

name: Collect sources

on:
  schedule:
    - cron: "41 9 * * 1"
  workflow_dispatch:
    inputs:
      max_entries:
        description: "Max registry entries to run (least recently run first)"
        default: "5"
      only:
        description: "Comma-separated registry ids to run instead (optional)"
        default: ""

permissions:
  contents: write
  pull-requests: write

# Share a group with news-fetch so two jobs never rewrite the database at once.
concurrency:
  group: news-fetch
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Run approved collectors (with verification audit)
        env:
          MAX_ENTRIES: ${{ inputs.max_entries || '5' }}
          ONLY: ${{ inputs.only }}
        run: |
          if [ -n "$ONLY" ]; then
            npx tsx scripts/collect/run.ts --only "$ONLY"
          else
            npx tsx scripts/collect/run.ts --max-entries "$MAX_ENTRIES"
          fi

      - name: Open pull request with the new data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/campus-universe.db; then
            echo "No database changes"
            exit 0
          fi
          branch="collect/$(date -u +%Y-%m-%d-%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add data/campus-universe.db
          git commit -m "Collect sources: refresh approved Devpost galleries"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Collect sources: $(date -u +%Y-%m-%d)" \
            --body "Automated bounded run of approved collectors (data/collectors/registry.json). The verification audit passed: every new affiliation is 'unverified'. Review the data, then merge promptly; if main's database changed first, re-run the workflow instead of resolving the binary conflict."
